<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinaki Alarm — Delete Account</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0d0d; color:#f0f0f0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .wrap { max-width:420px; margin:0 auto; padding:48px 24px; }
  h1 { font-size:24px; color:#56ccf2; margin-bottom:8px; }
  .tag { font-size:14px; color:#888; margin-bottom:28px; }
  .card { background:#161616; border:1px solid #2a2a2a; border-radius:16px; padding:24px; }
  .warn { background:#2a1515; border:1px solid #5a2a2a; border-radius:10px; padding:14px; font-size:13px; color:#e0a0a0; line-height:1.6; margin-bottom:20px; }
  label { display:block; font-size:13px; color:#aaa; margin-bottom:6px; margin-top:14px; }
  input { width:100%; background:#1f1f1f; border:1px solid #2a2a2a; border-radius:10px; padding:12px; color:#f0f0f0; font-size:14px; }
  button { width:100%; padding:14px; border:none; border-radius:12px; font-weight:600; font-size:15px; margin-top:18px; cursor:pointer; }
  #loginBtn { background:#2f80ed; color:#fff; }
  #deleteBtn { background:#e05252; color:#fff; }
  #cancelBtn { background:#1f1f1f; color:#aaa; border:1px solid #2a2a2a; margin-top:10px; }
  .msg { font-size:13px; margin-top:14px; text-align:center; }
  .err { color:#e05252; }
  .ok { color:#5cb85c; }
  .hidden { display:none; }
  .footer { font-size:12px; color:#555; margin-top:32px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Delete Account</h1>
  <p class="tag">Permanently delete your Pinaki Alarm account</p>

  <div id="step1" class="card">
    <p style="font-size:13px; color:#aaa; line-height:1.6;">Sign in below to permanently delete your account and all associated data (notifications, notes, and account settings).</p>
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="step2" class="card hidden">
    <div class="warn">This permanently deletes your account and all of your data. This cannot be undone.</div>
    <button id="deleteBtn">Delete my account</button>
    <button id="cancelBtn">Cancel</button>
    <p id="deleteMsg" class="msg"></p>
  </div>

  <p class="footer">Pinaki Alarm</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Fill these in from Supabase dashboard → Settings → API
  const SUPABASE_URL = 'https://tuxcuqynvddreegsvnom.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1eGN1cXludmRkcmVlZ3N2bm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDAwMDMsImV4cCI6MjA5NjU3NjAwM30.M5v2nK7k1LGTjDAmOHCGgdEZtPzPrGSmMdZjBbhRL_0';

  const supabase = window.supabase.createClient(SUPABASE_URL, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1eGN1cXludmRkcmVlZ3N2bm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDAwMDMsImV4cCI6MjA5NjU3NjAwM30.M5v2nK7k1LGTjDAmOHCGgdEZtPzPrGSmMdZjBbhRL_0);

  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');
  const deleteBtn = document.getElementById('deleteBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const deleteMsg = document.getElementById('deleteMsg');

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
      loginMsg.textContent = 'Enter your email and password.';
      loginMsg.className = 'msg err';
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    loginMsg.textContent = '';

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';

    if (error) {
      loginMsg.textContent = error.message;
      loginMsg.className = 'msg err';
      return;
    }
    step1.classList.add('hidden');
    step2.classList.remove('hidden');
  });

  cancelBtn.addEventListener('click', () => {
    step2.classList.add('hidden');
    step1.classList.remove('hidden');
  });

  deleteBtn.addEventListener('click', async () => {
    deleteBtn.disabled = true;
    deleteBtn.textContent = 'Deleting…';
    deleteMsg.textContent = '';

    const { error } = await supabase.rpc('delete_account');

    if (error) {
      deleteBtn.disabled = false;
      deleteBtn.textContent = 'Delete my account';
      deleteMsg.textContent = "Couldn't delete your account. Please try again.";
      deleteMsg.className = 'msg err';
      return;
    }

    await supabase.auth.signOut();
    deleteMsg.textContent = 'Your account has been deleted.';
    deleteMsg.className = 'msg ok';
    deleteBtn.classList.add('hidden');
    cancelBtn.classList.add('hidden');
  });
</script>
</body>
</html>
